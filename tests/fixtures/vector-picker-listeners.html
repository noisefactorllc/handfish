<!DOCTYPE html>
<html lang="en" data-theme="neutral-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vector pickers — document listener accounting fixture</title>
    <link rel="stylesheet" href="../../dist/styles/index.css">
    <link rel="stylesheet" href="../../dist/styles/themes/neutral.css">
    <style> body { margin: 0; background: var(--hf-bg-base); padding: 40px; } </style>
    <script>
        // Track live listeners on the two global targets a component could
        // reach for. Installed before the bundle is imported, so module-level
        // listeners land in the baseline and per-instance listeners show up as
        // a delta.
        //
        // The set is keyed the way the DOM keys its own listener list —
        // (target, type, listener, capture) — so registering the same triple
        // twice counts once, and removing something never registered counts
        // for nothing. An approximate counter would let an unbalanced remove
        // (-1) cancel out an unbalanced add (+1) and hide a leak.
        ;(function () {
            const ids = new WeakMap()
            let nextId = 1
            const idOf = (fn) => {
                if (fn === null || (typeof fn !== 'object' && typeof fn !== 'function')) return String(fn)
                if (!ids.has(fn)) ids.set(fn, nextId++)
                return ids.get(fn)
            }
            const nameOf = (target) => (target === document ? 'document' : target === window ? 'window' : null)
            const isCapture = (opts) => (opts === true || !!(opts && opts.capture)) ? 'capture' : 'bubble'
            const live = new Set()

            const add = EventTarget.prototype.addEventListener
            const remove = EventTarget.prototype.removeEventListener
            EventTarget.prototype.addEventListener = function (type, fn, opts) {
                const target = nameOf(this)
                if (target) live.add(`${target}|${type}|${idOf(fn)}|${isCapture(opts)}`)
                return add.call(this, type, fn, opts)
            }
            EventTarget.prototype.removeEventListener = function (type, fn, opts) {
                const target = nameOf(this)
                if (target) live.delete(`${target}|${type}|${idOf(fn)}|${isCapture(opts)}`)
                return remove.call(this, type, fn, opts)
            }

            const TYPES = ['mousemove', 'mouseup', 'touchmove', 'touchend']
            const snapshot = () => Object.fromEntries(TYPES.map(t =>
                [t, [...live].filter(k => k.split('|')[1] === t).length]
            ))
            // Marked by the test rather than at load, because Playwright
            // installs its own capturing window listeners for the very types
            // counted here, and does so lazily on first interaction. The spec
            // forces those into place and then marks, so the delta reflects
            // only what the component under test registered.
            let mark = snapshot()
            window.__mark = () => { mark = snapshot() }
            window.__delta = () => {
                const now = snapshot()
                return Object.fromEntries(TYPES.map(t => [t, now[t] - mark[t]]))
            }
        })()
    </script>
    <script type="module">
        import '../../dist/handfish.esm.js'
        Promise.all([
            customElements.whenDefined('vector3d-picker'),
            customElements.whenDefined('vector2d-picker'),
        ]).then(() => {
            let n = 0
            window.__make = (tag) => {
                const el = document.createElement(tag)
                el.id = `picker-${n++}`
                document.body.appendChild(el)
                window.__picker = el
                return el
            }

            // Synthesise touch sequences. Playwright's touchscreen API is
            // single-contact; the multi-touch cases below need two.
            window.__touch = (selector, type, points) => {
                const el = document.querySelector(selector)
                const rect = el.getBoundingClientRect()
                const touches = points.map(p => new Touch({
                    identifier: p.id,
                    target: el,
                    clientX: rect.left + rect.width * p.fx,
                    clientY: rect.top + rect.height * p.fy,
                }))
                const changed = type === 'touchend'
                    ? touches.slice(-1)
                    : touches
                el.dispatchEvent(new TouchEvent(type, {
                    touches: type === 'touchend' ? touches.slice(0, -1) : touches,
                    targetTouches: type === 'touchend' ? touches.slice(0, -1) : touches,
                    changedTouches: changed,
                    bubbles: true,
                    cancelable: true,
                }))
            }
            window.__ready = true
        })
    </script>
</head>
<body>
</body>
</html>
